<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d120f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phi Tiêu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Phi Tiêu · Tay ném</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d120f; --ink:#ece5d3; --dim:#8d9488; --brass:#c8a45c; --line:rgba(236,229,211,.18); --card:#151b17;
  --me:#c8a45c;
  --serif:"Fraunces",Georgia,serif; --sans:"Manrope",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
/* Chạy như ứng dụng: không bôi đen, không menu giữ lâu, không phóng to khi chạm đúp */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
html,body{position:fixed;inset:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{flex:none}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.head{flex:none;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.word{font-family:var(--serif);font-size:20px;font-variation-settings:"opsz" 72}
.word em{color:var(--brass);font-style:italic}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 20px 16px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.dock{flex:none;display:flex;gap:10px;padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--bg)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:0 18px;border-radius:12px;font-weight:800;font-size:18px;border:2px solid var(--line);flex:1;text-align:center;line-height:1.1}
.btn:active{transform:scale(.98);filter:brightness(.9)}
.btn.p{background:var(--brass);border-color:var(--brass);color:#1b1608;flex:1.5}
.btn.p[disabled]{background:#2a3029;border-color:#2a3029;color:#6b726b}
.btn.me{border-color:var(--me);color:var(--me)}
.btn.sm{min-height:56px;font-size:16px}
.who{display:flex;align-items:center;gap:14px;padding:16px 0}
.who i{width:6px;height:34px;background:var(--me);border-radius:3px}
.who b{font-size:20px;font-weight:800;flex:1}
.who span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--brass);border:1px solid var(--brass);padding:5px 9px;border-radius:5px}
.tip{background:var(--card);border-left:4px solid var(--me);border-radius:6px;padding:14px 16px;font-size:14px;line-height:1.5;color:#d4cfbf;margin-bottom:6px}
.sec{padding:20px 0 0}
.sec>.lab{margin-bottom:10px;display:block}
.seg{display:grid;gap:10px}
.c3{grid-template-columns:repeat(3,1fr)}
.opt{min-height:60px;border:2px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:16px;padding:8px}
.opt.on{border-color:var(--brass);background:rgba(200,164,92,.14);color:var(--brass)}
.card{width:100%;display:flex;gap:14px;align-items:center;text-align:left;min-height:76px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.card b{display:block;font-size:18px;font-weight:800}
.card small{display:block;font-size:13px;line-height:1.35;color:var(--dim);margin-top:3px}
.card .rd{width:26px;height:26px;border-radius:50%;border:2px solid var(--dim);flex:none;position:relative}
.card.on{border-color:var(--brass);background:rgba(200,164,92,.12)}
.card.on b{color:var(--brass)}
.card.on .rd{border-color:var(--brass)}
.card.on .rd::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--brass)}
.dis{opacity:.5;pointer-events:none}
.sw{display:flex;gap:3px}.sw i{width:16px;height:6px;display:block;border-radius:1px}
ul.pl{list-style:none}
ul.pl li{display:flex;gap:12px;align-items:center;padding:12px 0 12px 14px;border-bottom:1px solid var(--line);position:relative;font-size:17px}
ul.pl li::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;background:var(--c);border-radius:2px}
ul.pl li b{flex:1;font-weight:700}
ul.pl li span{font-family:var(--serif);font-size:22px;white-space:nowrap}
ul.pl li.w b{color:var(--brass)}
.center{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:10px 20px}
.big{font-family:var(--serif);font-size:clamp(40px,13vw,68px);line-height:1;letter-spacing:-.02em;font-variation-settings:"opsz" 144}
.sub{font-size:16px;color:#c9c3b2;line-height:1.45}
.info{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--brass);line-height:1.3}
.pips{display:flex;gap:14px}
.pips i{width:26px;height:26px;border-radius:50%;background:var(--ink)}
.pips i.used{background:transparent;box-shadow:inset 0 0 0 2px #4a524b}
.sc{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.sc b{color:var(--ink);font-size:20px;font-weight:500;letter-spacing:.02em;margin-left:6px}
.reacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 12px}
.reacts .btn{min-height:60px;font-size:17px;border-color:var(--me);color:var(--ink);background:rgba(255,255,255,.03)}
body.turn #app::after{content:"";position:absolute;inset:0;border:5px solid var(--me);pointer-events:none;animation:br 1.4s ease-in-out infinite}
@keyframes br{50%{opacity:.35}}
input{font:inherit;font-size:22px;font-weight:700;background:var(--card);border:2px solid var(--line);border-radius:12px;color:var(--ink);padding:0 16px;height:64px;width:100%;outline:none}
input:focus{border-color:var(--brass)}
input.code{text-align:center;letter-spacing:.4em;text-transform:uppercase;font-family:var(--mono)}
.sheet{position:fixed;inset:0;background:rgba(13,18,15,.95);display:flex;flex-direction:column;justify-content:flex-end;padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:12px;z-index:10}
.sheet .btn{flex:none;justify-content:flex-start;padding:0 20px}
#flash{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-family:var(--serif);font-size:64px;color:var(--brass);background:rgba(13,18,15,.82);pointer-events:none;text-align:center;padding:20px;z-index:20}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#111;font-weight:800;padding:12px 20px;border-radius:999px;display:none;z-index:20;font-size:15px}
.note{font-size:14px;color:var(--dim);line-height:1.5}
</style>
</head>
<body>
<main id="app"></main>
<div id="flash"></div>
<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ===== Hằng số chỉnh được ===== */
const RANGE=20;      // độ quay = 1 bán kính bia
const TH=14;         // ngưỡng gia tốc nhận cú ném (m/s²)
const PEAK_MS=130;   // thời gian thu đỉnh
const LOOKBACK=90;   // ms: lấy toạ độ ngắm trước khi vung
const COOLDOWN=1500;

const MODES=[
  ['classic','Cổ điển','Cộng điểm từng phi tiêu. Nhiều nhất thắng.'],
  ['lucky','Số May Mắn','Mỗi vòng một con số. Trúng số mới có điểm.'],
  ['around','Quanh Bia','Ném từ 1 đến 20 rồi trúng tâm. Ai xong trước thắng.'],
  ['survive','Sinh Tồn','Ném thấp hơn người trước là mất mạng. Cần 2 người trở lên.'],
  ['x01','301','Trừ dần về đúng 0 để thắng.']
];
const DIFFS=[['easy','Dễ'],['normal','Thường'],['hard','Khó']];
const THEMES=[['bar','Quán Bar',['#a8392e','#2f6a4b','#e7dcc0']],['go','Xưởng Gỗ',['#9c3b2a','#436b46','#ead9b5']],['dem','Đêm Muộn',['#b0453b','#3b6d8f','#dfe3e8']]];
const REACTS=['Cố lên!','Hụt rồi!','Ngon!','Hú hú!'];
const IC={
  cross:'<circle cx="12" cy="12" r="6"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  pause:'<path d="M8 5v14M16 5v14"/>',
  play:'<path d="M7 4l13 8-13 8z"/>',
  redo:'<path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/>',
  home:'<path d="M4 11l8-7 8 7M6 10v10h12V10"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  enter:'<path d="M5 12h14M13 6l6 6-6 6"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n||12)}catch(_){}};
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let code=(new URLSearchParams(location.search).get('r')||'').toUpperCase();

let scr='join',conn=null,st=null,myColor='#c8a45c',myName='',msgLine='Đang kết nối…';
let cal=null,last=null,hist=[],aim={x:0,y:0},lastSend=0,cooldown=0,thr=null,hasSensor=false,menuOpen=false;

/* ===== Toàn màn hình & khoá thao tác thừa ===== */
const isFull=()=>!!(document.fullscreenElement||document.webkitFullscreenElement||navigator.standalone||matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches);
function goFull(){
  try{
    const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!f)return;
    const r=f.call(el,{navigationUI:'hide'});
    if(r&&r.then)r.then(()=>{try{window.screen.orientation&&window.screen.orientation.lock&&window.screen.orientation.lock('portrait').catch(()=>{})}catch(_){}}).catch(()=>{});
  }catch(_){}
}
['contextmenu','selectstart','dblclick','dragstart','gesturestart','gesturechange','gestureend'].forEach(ev=>
  document.addEventListener(ev,e=>{if(e.target&&e.target.closest&&e.target.closest('input'))return;e.preventDefault()},{passive:false}));
document.addEventListener('click',()=>{if(scr==='game'&&!isFull())goFull()},true);

/* ===== Hiển thị ===== */
function shell(body,dock,scroll=true){
  return `<div class="head"><div class="word">Phi Tiêu <em>Điện Thoại</em></div><div class="lab">Phòng ${esc(code)}</div></div>
    <div class="${scroll?'scroll':'center'}">${body}</div>${dock?`<div class="dock">${dock}</div>`:''}`;
}
function calBtn(){return hasSensor?`<button class="btn me" data-a="cal">${ic('cross')}Căn giữa</button>`:''}
function view(){
  const app=$('#app');
  document.body.classList.toggle('turn',!!(st&&st.phase==='playing'&&st.myTurn));
  document.documentElement.style.setProperty('--me',myColor);

  if(scr==='join'){
    app.innerHTML=`<div class="head"><div class="word">Phi Tiêu <em>Điện Thoại</em></div></div>
      <div class="center">
        ${code?'':`<div class="lab">Mã phòng trên màn hình lớn</div><input id="room" class="code" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters">`}
        <div class="lab">Tên của bạn</div>
        <input id="name" maxlength="12" placeholder="Nhập tên" autocomplete="off" value="${esc(localStorage.getItem('pt_name')||'')}">
        <p class="note">${isIOS&&!navigator.standalone?'iPhone: muốn toàn màn hình, bấm Chia sẻ, chọn Thêm vào Màn hình chính, rồi mở từ biểu tượng đó. ':''}Điện thoại sẽ hỏi quyền cảm biến chuyển động, hãy chọn Cho phép.</p>
      </div>
      <div class="dock"><button class="btn p" data-a="join">${ic('enter')}Vào phòng</button></div>`;
    return;
  }
  if(!st){
    app.innerHTML=`<div class="center"><div class="big">${esc(msgLine)}</div></div>
      <div class="dock"><button class="btn p" data-a="retry">${ic('redo')}Thử lại</button></div>`;
    return;
  }
  const who=`<div class="who"><i></i><b>${esc(myName)}</b>${st.leader?'<span>CHỦ PHÒNG</span>':''}</div>`;

  if(st.phase==='lobby'){
    const c=st.cfg,L=st.leader,dis=L?'':'dis';
    const modes=MODES.map(([k,n,d])=>`<button class="card ${c.mode===k?'on':''} ${dis}" data-a="mode" data-v="${k}"><span class="rd"></span><span><b>${n}</b><small>${d}</small></span></button>`).join('');
    const rounds=(c.mode==='classic'||c.mode==='lucky')
      ?`<div class="seg c3">${[3,5,8].map(n=>`<button class="opt ${c.rounds===n?'on':''} ${dis}" data-a="rounds" data-v="${n}">${n} lượt</button>`).join('')}</div>`
      :`<p class="note">Chế độ này có số lượt cố định, tối đa ${st.rounds} lượt.</p>`;
    const diffs=DIFFS.map(([k,n])=>`<button class="opt ${c.diff===k?'on':''} ${dis}" data-a="diff" data-v="${k}">${n}</button>`).join('');
    const themes=THEMES.map(([k,n,cols])=>`<button class="opt ${c.theme===k?'on':''} ${dis}" data-a="theme" data-v="${k}"><span class="sw">${cols.map(x=>`<i style="background:${x}"></i>`).join('')}</span><span style="font-size:14px">${n}</span></button>`).join('');
    const ppl=st.players.map(p=>`<li style="--c:${p.color};${p.on?'':'opacity:.4'}"><b>${esc(p.name)}</b></li>`).join('');
    const body=who+`<div class="tip">${hasSensor?'Hướng điện thoại vào màn hình lớn. <b>Tâm mang tên bạn</b> sẽ chạy theo tay bạn. Lệch thì chạm <b>Căn giữa</b>.':'Máy không có cảm biến chuyển động. Bạn vẫn ném được bằng cách vuốt lên trên màn hình.'}</div>`+
      (L?'':`<p class="note" style="margin:10px 0 0"><b>${esc(st.leaderName)}</b> là chủ phòng và đang chọn chế độ. Thiết lập hiện ở dưới.</p>`)+
      `<div class="sec"><span class="lab">Chế độ</span>${modes}</div>
       <div class="sec"><span class="lab">Số lượt</span>${rounds}</div>
       <div class="sec"><span class="lab">Độ khó</span><div class="seg c3">${diffs}</div></div>
       <div class="sec"><span class="lab">Phòng</span><div class="seg c3">${themes}</div></div>
       <div class="sec"><span class="lab">Người chơi · ${st.players.filter(p=>p.on).length}</span><ul class="pl">${ppl}</ul></div>`;
    const dock=calBtn()+(L?`<button class="btn p" data-a="start" ${st.canStart?'':'disabled'}>${st.canStart?ic('play')+'Bắt đầu':'Cần 2 người'}</button>`:`<div class="btn" style="border-style:dashed;color:var(--dim);font-size:15px">Chờ chủ phòng…</div>`);
    app.innerHTML=shell(body,dock);
    return;
  }
  if(st.phase==='results'){
    const body=`<div class="lab">${st.win?'Bạn thắng':'Kết thúc'}</div><div class="big" style="color:${st.win?'var(--brass)':'var(--ink)'}">${st.win?'Chiến thắng':'Hết trận'}</div>
      <ul class="pl">${st.rank.map((p,i)=>`<li class="${p.w?'w':''}" style="--c:${p.color}"><b>${i+1}. ${esc(p.name)}</b><span>${esc(p.v)}</span></li>`).join('')}</ul>`;
    const dock=st.leader?`<button class="btn" data-a="lobby">${ic('home')}Về sảnh</button><button class="btn p" data-a="again">${ic('redo')}Chơi lại</button>`:`<div class="btn" style="border-style:dashed;color:var(--dim);font-size:15px">Chờ chủ phòng chọn tiếp…</div>`;
    app.innerHTML=shell(body,dock,false);
    return;
  }
  // đang chơi / tạm dừng
  const paused=st.phase==='paused';
  let main;
  if(paused)main=`<div class="lab">Trận đấu</div><div class="big">Tạm dừng</div>`;
  else if(st.myTurn)main=`<div class="lab">Lượt ${st.round} / ${st.rounds}</div><div class="big">Lượt của bạn</div><div class="pips">${[0,1,2].map(i=>`<i class="${i<st.dartsLeft?'':'used'}"></i>`).join('')}</div>${st.info?`<div class="info">${esc(st.info)}</div>`:''}<p class="sub">${hasSensor?'Ngắm vào bia, rồi vung tay như ném phi tiêu.':'Vuốt lên màn hình để ném.'}</p>`;
  else main=`<div class="lab">Lượt ${st.round} / ${st.rounds}</div><div class="big">${esc(st.cur)}</div><p class="sub">đang ném.</p>${st.info?`<div class="info">${esc(st.info)}</div>`:''}`;
  const sc=`<div class="sc">${esc(st.lab)}<b>${esc(st.sv)}</b></div>`;
  const reacts=(!st.myTurn||paused)?`<div class="reacts">${REACTS.map((t,i)=>`<button class="btn" data-a="react" data-v="${i}">${t}</button>`).join('')}</div>`:'';
  const dock=calBtn()+(st.leader?`<button class="btn" data-a="menu">${ic('menu')}Menu</button>`:'');
  const sheet=(menuOpen&&st.leader)?`<div class="sheet"><div class="lab">Menu chủ phòng</div>
      ${paused?`<button class="btn p" data-a="resume">${ic('play')}Tiếp tục</button>`:`<button class="btn p" data-a="pause">${ic('pause')}Tạm dừng</button>`}
      <button class="btn" data-a="again" data-c="Chơi lại từ đầu?">${ic('redo')}Chơi lại từ đầu</button>
      <button class="btn" data-a="lobby" data-c="Về sảnh và bỏ trận này?">${ic('home')}Về sảnh, đổi chế độ</button>
      <button class="btn" data-a="menu">${ic('close')}Đóng</button></div>`:'';
  app.innerHTML=`<div class="head"><div class="word">Phi Tiêu <em>Điện Thoại</em></div><div class="lab">Phòng ${esc(code)}</div></div>
    <div class="center">${main}${sc}</div>${reacts}<div class="dock">${dock}</div>${sheet}`;
}
function flash(t,ms){const f=$('#flash');f.textContent=t;f.style.display='flex';setTimeout(()=>f.style.display='none',ms||900)}
let toastT=0;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',1100)}

/* ===== Hành động ===== */
const send=m=>{try{conn&&conn.open&&conn.send(m)}catch(_){}};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  buzz();act(b.dataset.a,b.dataset.v,b.dataset.c);
});
function act(a,v,confirmMsg){
  if(a==='join')return join();
  if(a==='retry')return location.reload();
  if(a==='cal'){
    if(last){cal={a:last.alpha,b:last.beta};hist=[];aim={x:0,y:0};send({t:'aim',x:0,y:0});buzz([20,30,20]);toast('Đã căn giữa')}
    else toast('Chưa nhận được cảm biến');
    return;
  }
  if(a==='react'){send({t:'react',k:+v});toast(REACTS[+v]);return}
  if(a==='menu'){menuOpen=!menuOpen;return view()}
  if(confirmMsg&&!confirm(confirmMsg))return;
  menuOpen=false;
  if(a==='mode'||a==='diff'||a==='theme'){send({t:'cfg',[a]:v});if(st)st.cfg[a]=v;view()}
  else if(a==='rounds'){send({t:'cfg',rounds:+v});if(st)st.cfg.rounds=+v;view()}
  else if(a==='start'||a==='again'||a==='pause'||a==='resume'||a==='lobby'){send({t:a});view()}
}

/* ===== Kết nối ===== */
async function join(){
  goFull(); // phải gọi ngay trong cú chạm
  const rEl=$('#room');if(rEl)code=rEl.value.trim().toUpperCase();
  if(code.length!==4){toast('Nhập mã phòng 4 ký tự');return}
  const el=$('#name');
  myName=((el&&el.value.trim())||'Người chơi').slice(0,12);
  try{localStorage.setItem('pt_name',myName)}catch(_){}
  try{
    const reqs=[];
    if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)reqs.push(DeviceMotionEvent.requestPermission());
    if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)reqs.push(DeviceOrientationEvent.requestPermission());
    if(reqs.length)await Promise.all(reqs);
  }catch(_){}
  addEventListener('deviceorientation',onOri);
  addEventListener('devicemotion',onMotion);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(_){}
  scr='game';msgLine='Đang kết nối…';view();
  connect();
  setTimeout(()=>{if(st)view()},1800);
}
function connect(){
  const peer=new Peer();
  peer.on('open',()=>{
    conn=peer.connect('phitieu-'+code,{reliable:true});
    conn.on('open',()=>conn.send({t:'hello',name:myName}));
    conn.on('data',onMsg);
    conn.on('close',lost);conn.on('error',lost);
    setTimeout(()=>{if(!st){msgLine='Không tìm thấy phòng';view()}},8000);
  });
  peer.on('error',e=>{msgLine='Không vào được phòng ('+e.type+')';st=null;view()});
}
function lost(){st=null;msgLine='Mất kết nối';view()}
function onMsg(m){
  if(!m)return;
  if(m.t==='welcome'){myColor=m.color;view()}
  else if(m.t==='full'){st=null;msgLine='Phòng đã đầy';view()}
  else if(m.t==='state'){
    if(st&&st.phase!=='playing'&&m.phase==='playing'){menuOpen=false;buzz([30,40,30])}
    if(m.phase==='lobby'||m.phase==='results')menuOpen=false;
    st=m;view();
  }else if(m.t==='hit'){
    buzz(m.bust?[80,60,80]:m.hi?[60,40,60]:40);
    flash(m.txt,m.txt&&m.txt.length>10?1100:900);
  }
}

/* ===== Cảm biến ===== */
function onOri(e){
  if(e.alpha==null||e.beta==null)return;
  if(!hasSensor){hasSensor=true;if(st)view()}
  last={alpha:e.alpha,beta:e.beta};
  if(!cal)cal={a:e.alpha,b:e.beta};
  const dA=((e.alpha-cal.a+540)%360)-180,dB=e.beta-cal.b;
  const target={x:clamp(-dA/RANGE,-2.5,2.5),y:clamp(-dB/RANGE,-2.5,2.5)};
  aim.x+=(target.x-aim.x)*.6;aim.y+=(target.y-aim.y)*.6;
  const now=performance.now();
  hist.push({t:now,x:aim.x,y:aim.y});
  while(hist.length&&now-hist[0].t>600)hist.shift();
  if(now-lastSend>50&&conn&&conn.open){lastSend=now;conn.send({t:'aim',x:aim.x,y:aim.y})}
}
function aimAt(t){
  for(let i=hist.length-1;i>=0;i--)if(hist[i].t<=t)return hist[i];
  return hist[0]||aim;
}
function onMotion(e){
  if(!st||st.phase!=='playing'||!st.myTurn||st.dartsLeft<=0)return;
  const now=performance.now();
  if(now<cooldown)return;
  let mag=0;
  const a=e.acceleration;
  if(a&&a.x!=null)mag=Math.hypot(a.x,a.y,a.z);
  else if(e.accelerationIncludingGravity){const g=e.accelerationIncludingGravity;mag=Math.abs(Math.hypot(g.x||0,g.y||0,g.z||0)-9.81)}
  if(!thr){
    if(mag>TH){const s=aimAt(now-LOOKBACK);thr={t0:now,peak:mag,x:s.x,y:s.y}}
  }else{
    thr.peak=Math.max(thr.peak,mag);
    if(now-thr.t0>PEAK_MS){fire(thr.x,thr.y,thr.peak);thr=null}
  }
}
function fire(x,y,p){
  cooldown=performance.now()+COOLDOWN;
  buzz(25);
  send({t:'throw',x,y,p});
}

/* ===== Vuốt lên để ném (máy không có cảm biến) ===== */
let ts=null;
document.addEventListener('touchstart',e=>{
  if(e.target.closest('button,input,.sheet'))return;
  const t=e.changedTouches[0];ts={y:t.clientY,t:performance.now()};
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!ts||!st||st.phase!=='playing'||!st.myTurn||performance.now()<cooldown){ts=null;return}
  const t=e.changedTouches[0],dy=ts.y-t.clientY,dt=Math.max(30,performance.now()-ts.t);
  ts=null;
  if(dy>80&&dt<500){
    const s=hasSensor?aimAt(performance.now()-LOOKBACK):aim;
    fire(s.x,s.y,clamp(10+dy/dt*10,10,38));
  }
},{passive:true});

view();
</script>
